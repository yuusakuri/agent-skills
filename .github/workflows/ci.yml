name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out catalog
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run validator tests
        run: ./tests/validate_test.sh

      - name: Run snapshot updater tests
        run: ./tests/update_vendored_skills_test.sh

      - name: Check catalog policy
        run: ./tests/catalog_test.sh

      - name: Check consumer-ready layout
        run: ./tests/consumer_test.sh

      - name: Verify committed snapshot
        run: ./scripts/update-vendored-skills.sh --check
