name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check script syntax
        run: |
          python -m py_compile scripts/*.py
          bash -n tests/*.sh

      - name: Run validator tests
        run: bash tests/validate_test.sh

      - name: Run snapshot updater tests
        run: bash tests/update_catalog_test.sh

      - name: Check catalog policy
        run: bash tests/catalog_test.sh

      - name: Check consumer-ready layout
        run: |
          bash tests/sync_agent_links_test.sh
          bash tests/consumer_test.sh

      - name: Validate packaged UI skill
        run: |
          python skills/ui-ux-pro-max/scripts/validate_data.py
          python -m unittest discover \
            -s skills/ui-ux-pro-max/scripts/tests \
            -p "test_*.py"

      - name: Verify committed snapshot
        run: python scripts/update_catalog.py --check
